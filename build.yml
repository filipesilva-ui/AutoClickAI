name: Build AutoClickAI for Windows

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Get source code
        uses: actions/checkout@v4

      - name: Set up Python in cloud runner
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Build standalone EXE
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name AutoClickAI autoclick_ai_demo.py

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: AutoClickAI-Windows
          path: dist/AutoClickAI.exe
          if-no-files-found: error
          retention-days: 7
